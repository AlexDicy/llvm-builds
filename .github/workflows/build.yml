# Builds the LLVM packages Ens links against, per platform, with the configuration Ens uses, and
# publishes them as release assets. Dispatch only: each selected platform costs tens of minutes.
name: build

on:
  workflow_dispatch:
    inputs:
      linux_x64:
        description: "Linux x86_64"
        type: boolean
        default: true
      linux_arm64:
        description: "Linux arm64"
        type: boolean
        default: true
      macos_arm64:
        description: "macOS arm64"
        type: boolean
        default: true
      windows_x64:
        description: "Windows x86_64"
        type: boolean
        default: true
      windows_arm64:
        description: "Windows arm64"
        type: boolean
        default: true
      publish:
        description: "Publish the release, or leave it as a draft to be added to and published by hand"
        type: boolean
        default: false
      tag:
        description: "Release tag to publish under (must be unused: published releases are immutable)"
        type: string
        default: "llvm-21.1.0-1"

permissions:
  contents: write

jobs:
  # Which platforms were ticked, as the matrix the build job runs. A job-level "if" cannot read the
  # matrix it belongs to, so the choice is resolved here and handed on as JSON.
  select:
    name: select
    runs-on: ubuntu-22.04
    outputs:
      platforms: ${{ steps.pick.outputs.platforms }}
    steps:
      - name: Resolve the ticked platforms
        id: pick
        env:
          LX64: ${{ github.event.inputs.linux_x64 }}
          LARM: ${{ github.event.inputs.linux_arm64 }}
          MARM: ${{ github.event.inputs.macos_arm64 }}
          WX64: ${{ github.event.inputs.windows_x64 }}
          WARM: ${{ github.event.inputs.windows_arm64 }}
        run: |
          set -eu
          picked="["
          sep=""
          add() { picked="$picked$sep$1"; sep=","; }
          if [ "$LX64" = "true" ]; then
            add '{"key":"linux_x64","slug":"linux-x64","os":"ubuntu-22.04","plat":"linux","arch":"x64"}'
          fi
          if [ "$LARM" = "true" ]; then
            add '{"key":"linux_arm64","slug":"linux-arm64","os":"ubuntu-22.04-arm","plat":"linux","arch":"arm64"}'
          fi
          if [ "$MARM" = "true" ]; then
            add '{"key":"macos_arm64","slug":"macos-arm64","os":"macos-15","plat":"macosx","arch":"arm64"}'
          fi
          if [ "$WX64" = "true" ]; then
            add '{"key":"windows_x64","slug":"windows-x64","os":"windows-2022","plat":"windows","arch":"x64"}'
          fi
          if [ "$WARM" = "true" ]; then
            add '{"key":"windows_arm64","slug":"windows-arm64","os":"windows-11-arm","plat":"windows","arch":"arm64"}'
          fi
          picked="$picked]"
          echo "platforms=$picked" >> "$GITHUB_OUTPUT"
          echo "$picked"

  build:
    name: ${{ matrix.slug }}
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    env:
      # the xmake Ens's own CI pins, so the configure here matches the configure there
      XMAKE_VERSION: '3.1.1'
      LLVM_VERSION: '21.1.0'
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      # binutils-dev carries plugin-api.h, which LLVM's gold plugin target compiles against; the
      # rest are the libraries LLVM looks for.
      - name: Install the LLVM build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-dev zlib1g-dev libzstd-dev libedit-dev libffi-dev libxml2-dev pkg-config

      # LLVM's build pulls python in as a build tool, and macOS's python build otherwise finds the
      # system LibreSSL, which has no _SSLv3_method: that is what broke the first run. brew's
      # openssl@3 is keg-only, so it has to be pointed at explicitly.
      - name: Point python's build at brew's OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          prefix=$(brew --prefix openssl@3 2>/dev/null || echo /opt/homebrew/opt/openssl@3)
          echo "using $prefix"
          ls "$prefix/lib/libssl.dylib"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$prefix/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$prefix/lib" >> "$GITHUB_ENV"

      # the packages are built against the toolchain the release publishes, so that what this
      # repository builds is built against exactly what ens downloads
      - name: Cache the xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: xmake-packages-${{ matrix.slug }}-${{ hashFiles('xmake.lua', 'ens-repository/**') }}

      - name: Resolve and install the packages
        run: |
          xmake f -y -m release -p ${{ matrix.plat }} -a ${{ matrix.arch }}
          xmake require -y

      # xmake hides a failed build's output in the package's install log
      - name: Show the package install log
        if: failure()
        run: |
          for f in $(find ~/.xmake/cache/packages -path '*installdir.failed*' -name install.txt 2>/dev/null); do
            echo "=== $f"
            tail -80 "$f"
          done

      - name: Pack the installed prefixes
        shell: bash
        run: |
          set -eu
          # xmake is the only thing that knows where its global dir is; on Windows it is not $HOME
          global=$(xmake l -c 'import("core.base.global"); print(global.directory())' | tail -1)
          echo "global dir: $global"
          for name in llvm libllvm; do
            dir=$(find "$global/packages/l/$name/$LLVM_VERSION" -mindepth 1 -maxdepth 1 -type d | head -1)
            test -n "$dir"
            out="llvm-$LLVM_VERSION-${{ matrix.slug }}-$name.tar.xz"
            rm -f "$out"
            tar -cJf "$out" -C "$dir" . || { rm -f "$out"; (cd "$dir" && 7z a -txz "$GITHUB_WORKSPACE/$out" ./* > /dev/null); }
            ls -l "$out"
            sha256sum "$out" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: |
            llvm-*.tar.xz
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: release
    needs: build
    # publish whatever built, so one broken platform does not throw away the others' work
    if: always() && !cancelled()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Published releases are immutable: nothing can be added to them afterwards. So the assets
      # are staged as a draft, and published in one go, and only once every selected platform is
      # actually present. The tag must therefore be unused.
      - name: Stage and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          IN_LINUX_X64: ${{ github.event.inputs.linux_x64 }}
          IN_LINUX_ARM64: ${{ github.event.inputs.linux_arm64 }}
          IN_MACOS_ARM64: ${{ github.event.inputs.macos_arm64 }}
          IN_WINDOWS_X64: ${{ github.event.inputs.windows_x64 }}
          IN_WINDOWS_ARM64: ${{ github.event.inputs.windows_arm64 }}
          PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          set -eu
          expected=0
          if [ "$IN_LINUX_X64" = "true" ]; then expected=$((expected + 2)); fi
          if [ "$IN_LINUX_ARM64" = "true" ]; then expected=$((expected + 2)); fi
          if [ "$IN_MACOS_ARM64" = "true" ]; then expected=$((expected + 2)); fi
          if [ "$IN_WINDOWS_X64" = "true" ]; then expected=$((expected + 2)); fi
          if [ "$IN_WINDOWS_ARM64" = "true" ]; then expected=$((expected + 2)); fi
          found=$(find assets -name '*.tar.xz' | wc -l)
          echo "archives found: $found, expected: $expected"
          find assets -name '*.tar.xz' | sort
          if [ "$found" -ne "$expected" ]; then
            echo "not publishing: a selected platform is missing"
            exit 0
          fi
          (cd assets && sha256sum ./*.tar.xz > SHA256SUMS.txt)
          cat assets/SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "The LLVM packages ens links against, built from source on the platform each asset names. Native objects, no LTO." 2>/dev/null || true
          gh release upload "$TAG" assets/llvm-*.tar.xz assets/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          if [ "$PUBLISH" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            echo "published $TAG"
          else
            echo "staged $TAG as a draft"
          fi
